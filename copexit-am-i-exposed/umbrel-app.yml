id: copexit-am-i-exposed
category: bitcoin
name: "am-i.exposed"
version: "0.42.1"
tagline: Bitcoin privacy scanner - see what the blockchain reveals about you
description: >-
  Paste a Bitcoin address, transaction ID, xpub or descriptor, or an unsigned
  PSBT and get a privacy score from 0 to 100 with clear findings and fixes. The
  engine runs 34 heuristics and 10 chain analysis modules covering address
  reuse, change detection, CoinJoin detection (Whirlpool, WabiSabi,
  JoinMarket), script types, timing, wallet fingerprinting and entity
  proximity, plus Boltzmann entropy computed on-device and an interactive
  transaction graph explorer.


  All analysis runs client-side in your browser. Blockchain data comes from
  your local Umbrel mempool instance, so your addresses and transactions never
  leave your network. The optional Chainalysis check is routed over Tor. No
  tracking, no logging, no third-party analytics.


  Requires the Mempool app to be installed.
releaseNotes: >-
  Works with Umbrel nodes on signet and testnet4: the app now asks your node
  which network it runs instead of assuming mainnet, so tpub/vpub wallets and
  tb1 addresses scan on a signet or testnet4 Umbrel. Coin selection ranks
  plans strictly by the guide's rules (never merge change, then change size,
  then new links), explains what an observer learns from each plan, and shows
  two options side by side when there is no clean choice.
